# COLUMN-NAME RULES for the official PS-019 taxonomy (config/classes.yaml).
#
# STATUS: provisional. The TAXONOMY is confirmed, but these rules are a first-draft,
# team-authored heuristic that has only been evaluated on a team-authored synthetic dataset.
# Change rules_status to "confirmed" only when the team deliberately freezes the rules
# for its final evaluation. This status says nothing about legal or organizer approval.
#
# Matching is on column NAMES only, never on cell values, so these rules CANNOT detect
# every personal-data column and WILL flag some columns that are not personal data:
#   - misses: opaque names (for example col_17, tax_ref) and abbreviations not listed below
#   - false positives: names that contain a keyword but hold something else and are not
#     covered by an exclusion (for example a column called "name" that holds product names;
#     a name-only rule cannot know that)
#   - ambiguity: email_address matches CONTACT_INFORMATION (email) and LOCATION_ADDRESS
#     (address); pan_card_number and voter_card_no match GOVERNMENT_IDENTIFIERS and
#     FINANCIAL_INFORMATION ("card number"). All findings are kept and listed for review,
#     never silently resolved. They are deliberately NOT excluded.
# Every finding is a technical candidate for human review, not a legal determination.
#
# token: the pattern's tokens occur as a contiguous run in the column name's tokens
#        (names are split on punctuation, underscores and camelCase, then casefolded)
# exact: the column name's tokens equal the pattern's tokens
# exclude_patterns (optional): if any of these phrases occurs as a contiguous token run in
#        the column name, THIS rule does not fire. Other rules are unaffected. Each exclusion
#        must be a phrase of at least two tokens (a single word such as "count" is rejected
#        by the loader) and may not repeat one of the rule's own patterns.
# Quote patterns such as "no", "yes", "on" or numbers so YAML keeps them as strings.
#
# Rule families (the rule id tells a reviewer which kind of evidence matched):
#   RULE_<CLASS>_<TOPIC>                  full-word keywords (the original rules)
#   RULE_<CLASS>_<TOPIC>_ABBREV           conventional abbreviations of those keywords, and
#                                         concatenated spellings such as firstname or cardno
#                                         (the tokenizer cannot split an all-lowercase word)
#   RULE_<CLASS>_<TOPIC>_PROVISIONAL      abbreviations whose expansion is NOT unique
#                                         (for example "pin" is a postal PIN code OR a
#                                         secret PIN; "uid" is an Aadhaar UID OR a user id).
#                                         They are kept as reviewable candidates and must not
#                                         be treated as established evidence.
rules_status: provisional
rules:
  # ---- PERSONAL_IDENTITY: name, date of birth, gender, age
  - id: RULE_PI_NAME_PHRASE
    class_id: PERSONAL_IDENTITY
    match: token
    patterns:
      - full name
      - first name
      - last name
      - middle name
      - given name
      - family name
      - surname
      - customer name
      - employee name
      - applicant name
      - holder name
      - nominee name
  - id: RULE_PI_NAME_ABBREV
    class_id: PERSONAL_IDENTITY
    match: token
    patterns:
      - fname
      - lname
      - mname
      - f name
      - l name
      - m name
      - first nm
      - last nm
      - middle nm
      - full nm
      - cust name
      - cust nm
      - customer nm
      - emp name
      - emp nm
      - employee nm
      - fullname
      - firstname
      - lastname
      - middlename
      - givenname
      - familyname
      - customername
      - employeename
  - id: RULE_PI_NAME_EXACT
    class_id: PERSONAL_IDENTITY
    match: exact
    patterns: [name]
  - id: RULE_PI_DOB
    class_id: PERSONAL_IDENTITY
    match: token
    patterns: [dob, date of birth, birth date, birthdate, birthday]
  - id: RULE_PI_DOB_ABBREV
    class_id: PERSONAL_IDENTITY
    match: token
    patterns: [d o b, dt of birth, birth dt, birth day, bday, b day, dateofbirth]
  - id: RULE_PI_GENDER
    class_id: PERSONAL_IDENTITY
    match: token
    patterns: [gender, sex]
    exclude_patterns:
      - gender ratio
      - gender pay gap
      - gender gap
      - gender distribution
      - gender balance
      - sex ratio
  - id: RULE_PI_GENDER_ABBREV
    class_id: PERSONAL_IDENTITY
    match: token
    patterns: [gndr, gendr]
  - id: RULE_PI_AGE
    class_id: PERSONAL_IDENTITY
    match: token
    patterns: [age]
    exclude_patterns:
      # the age of a thing or a policy limit, not of a person
      - age bucket size
      - age limit
      - age rating
      - age restriction
      - age of account
      - account age
      - device age
      - file age
      - session age
      - password age
      - token age
      - cache age
      - asset age
  - id: RULE_PI_AGE_ABBREV
    class_id: PERSONAL_IDENTITY
    match: token
    patterns: [yrs old, yr old, years old]

  # ---- CONTACT_INFORMATION: email address, phone number
  - id: RULE_CI_EMAIL
    class_id: CONTACT_INFORMATION
    match: token
    patterns: [email, e mail]
    exclude_patterns:
      # something ABOUT e-mail, not an e-mail address
      - email sent
      - email opt in
      - email opt out
      - email template
      - email bounce
      - email domain
      - email verified
      - email subscribed
      - email campaign
  - id: RULE_CI_EMAIL_ABBREV
    class_id: CONTACT_INFORMATION
    match: token
    patterns: [eml, emailid, mailid, emailaddress]
  - id: RULE_CI_EMAIL_ABBREV_PROVISIONAL
    class_id: CONTACT_INFORMATION
    match: token
    # "em" can also abbreviate "employee"; "mail id" can be a mail-server message id.
    patterns: [em id, em addr, mail id]
  - id: RULE_CI_PHONE
    class_id: CONTACT_INFORMATION
    match: token
    patterns: [phone, mobile, telephone, msisdn, contact number, contact no]
    exclude_patterns:
      # a device, app or event, not a phone number
      - phone model
      - phone brand
      - phone os
      - phone verified
      - phone call
      - mobile os
      - mobile app
      - mobile model
      - mobile device
      - mobile browser
  - id: RULE_CI_PHONE_ABBREV
    class_id: CONTACT_INFORMATION
    match: token
    patterns:
      - ph no
      - ph num
      - ph nbr
      - ph number
      - phn
      - phn no
      - phn num
      - tel no
      - tel num
      - tel number
      - telno
      - tele no
      - tele num
      - cell no
      - cell num
      - cell number
      - cell phone
      - cellphone
      - mob no
      - mob num
      - mob number
      - mobno
      - contact num
      - contact nbr
      - phonenumber
      - phoneno
      - mobilenumber
      - mobileno
      - contactnumber
      - telephonenumber
  - id: RULE_CI_PHONE_ABBREV_EXACT
    class_id: CONTACT_INFORMATION
    match: exact
    # whole-name only: "mob_app_version" or "tel_aviv_office" must not match
    patterns: [mob, tel]
  - id: RULE_CI_CONTACT_GENERIC_PROVISIONAL
    class_id: CONTACT_INFORMATION
    match: token
    # a generic contact container: may hold a phone, an e-mail or neither
    patterns: [contact detail, contact details, contact info, contact information]

  # ---- GOVERNMENT_IDENTIFIERS: Aadhaar, PAN, passport, voter ID, driving licence
  - id: RULE_GI_AADHAAR
    class_id: GOVERNMENT_IDENTIFIERS
    match: token
    patterns: [aadhaar, aadhar, uidai]
  - id: RULE_GI_AADHAAR_ABBREV
    class_id: GOVERNMENT_IDENTIFIERS
    match: token
    patterns: [adhar, adhaar, adhr, aadhr]
  - id: RULE_GI_AADHAAR_ABBREV_PROVISIONAL
    class_id: GOVERNMENT_IDENTIFIERS
    match: token
    # "uid" is the Aadhaar unique id, but also a generic "user id" in many databases.
    patterns: [uid no, uid num, uid number]
  - id: RULE_GI_PAN
    class_id: GOVERNMENT_IDENTIFIERS
    match: token
    patterns: [pan]
    exclude_patterns:
      - pan india
      - pan asia
      - pan global
      - pan european
  - id: RULE_GI_PASSPORT
    class_id: GOVERNMENT_IDENTIFIERS
    match: token
    patterns: [passport]
    exclude_patterns:
      # a date attribute of the document, not the passport identifier (judgement call:
      # reviewers who treat document dates as in scope can delete these three lines)
      - passport expiry
      - passport issue
      - passport validity
  - id: RULE_GI_PASSPORT_ABBREV
    class_id: GOVERNMENT_IDENTIFIERS
    match: token
    patterns: [pspt, pport, pasport, passprt]
  - id: RULE_GI_PASSPORT_ABBREV_PROVISIONAL
    class_id: GOVERNMENT_IDENTIFIERS
    match: token
    # "ppt" is also the PowerPoint extension.
    patterns: [ppt no, ppt num, ppt number]
  - id: RULE_GI_VOTER
    class_id: GOVERNMENT_IDENTIFIERS
    match: token
    patterns: [voter]
    exclude_patterns:
      - voter turnout
  - id: RULE_GI_VOTER_ABBREV_PROVISIONAL
    class_id: GOVERNMENT_IDENTIFIERS
    match: token
    # EPIC = Elector's Photo Identity Card; "epic" is also an agile-tracker term.
    patterns: [epic no, epic num, epic number]
  - id: RULE_GI_LICENCE
    class_id: GOVERNMENT_IDENTIFIERS
    match: token
    patterns:
      - driving licence
      - driving license
      - driver licence
      - driver license
  - id: RULE_GI_LICENCE_ABBREV
    class_id: GOVERNMENT_IDENTIFIERS
    match: token
    patterns:
      - dl no
      - dl num
      - dl number
      - dlno
      - drv lic
      - dr lic
      - driving lic
      - driver lic
      - drivinglicence
      - drivinglicense
      - driverlicence
      - driverlicense

  # ---- FINANCIAL_INFORMATION: bank account number, IFSC, card number, UPI ID
  - id: RULE_FI_BANK_ACCOUNT
    class_id: FINANCIAL_INFORMATION
    match: token
    patterns: [bank account, account number, account no, acct no]
  - id: RULE_FI_BANK_ACCOUNT_ABBREV
    class_id: FINANCIAL_INFORMATION
    match: token
    patterns:
      - bk acct
      - bnk acct
      - bank acct
      - bank acc
      - bank ac
      - acct num
      - acct number
      - a c no
      - accountnumber
      - accountno
      - bankaccount
      - bankaccountnumber
  - id: RULE_FI_ACCOUNT_ABBREV_PROVISIONAL
    class_id: FINANCIAL_INFORMATION
    match: token
    # "acc" can also abbreviate access, accession or accuracy.
    patterns: [acc no, acc num, acc number]
  - id: RULE_FI_IFSC
    class_id: FINANCIAL_INFORMATION
    match: token
    patterns: [ifsc]
    exclude_patterns:
      - ifsc verified
      - ifsc validated
  - id: RULE_FI_IFSC_ABBREV
    class_id: FINANCIAL_INFORMATION
    match: token
    patterns: [ifs cd, ifs code, ifsc cd]
  - id: RULE_FI_CARD
    class_id: FINANCIAL_INFORMATION
    match: token
    patterns: [card number, card no, credit card, debit card]
  - id: RULE_FI_CARD_ABBREV
    class_id: FINANCIAL_INFORMATION
    match: token
    patterns:
      - card num
      - cc num
      - cc no
      - cc number
      - ccnum
      - cr card
      - dr card
      - cardnumber
      - cardno
      - creditcard
      - debitcard
      - creditcardnumber
      - debitcardnumber
  - id: RULE_FI_UPI
    class_id: FINANCIAL_INFORMATION
    match: token
    patterns: [upi, vpa]
    exclude_patterns:
      - upi enabled
      - upi verified
  - id: RULE_FI_UPI_ABBREV
    class_id: FINANCIAL_INFORMATION
    match: token
    patterns: [pay handle, payment handle]

  # ---- LOCATION_ADDRESS: postal address, PIN code, geo-coordinates
  # Taxonomy semantics (config/classes.yaml): "Postal address, PIN code, geo-coordinates".
  # Network and web addresses (IP, MAC, URL) are therefore not postal addresses. They are
  # excluded from the address rules; the exclusions are named kinds of address, so a bare
  # "address" or "home_address" is unaffected.
  - id: RULE_LA_ADDRESS
    class_id: LOCATION_ADDRESS
    match: token
    patterns: [address]
    exclude_patterns:
      - ip address
      - ipv4 address
      - ipv6 address
      - mac address
      - web address
      - url address
      - network address
      - server address
      - host address
      - memory address
      - address count
      - address type
      - address verified
  - id: RULE_LA_ADDRESS_ABBREV
    class_id: LOCATION_ADDRESS
    match: token
    patterns: [addr]
    exclude_patterns:
      - ip addr
      - mac addr
      - web addr
      - url addr
      - server addr
      - host addr
      - addr count
      - addr type
      - addr verified
  - id: RULE_LA_POSTAL_CODE
    class_id: LOCATION_ADDRESS
    match: token
    patterns: [pincode, pin code, postal code, zip, zipcode, zip code]
    exclude_patterns:
      # the compression format, not a ZIP/postal code
      - zip compression
      - zip archive
      - zip file
      - zip folder
  - id: RULE_LA_POSTAL_ABBREV
    class_id: LOCATION_ADDRESS
    match: token
    patterns: [postcode, post code, pin cd, zip cd, postal cd, postalcode]
  - id: RULE_LA_PIN_PROVISIONAL
    class_id: LOCATION_ADDRESS
    match: exact
    # A bare "pin" can be a postal PIN code (kept here as a reviewable candidate) or a secret
    # PIN/credential. Exact match only: "atm_pin", "pin_hash" or "pinned" never match.
    patterns: [pin]
  - id: RULE_LA_GEO
    class_id: LOCATION_ADDRESS
    match: token
    patterns: [latitude, longitude, lat, lon, lng, geolocation, geo location, gps]
    exclude_patterns:
      # settings or quality of a reading, not a coordinate
      - latitude precision
      - longitude precision
      - gps enabled
      - gps accuracy
      - gps signal
  - id: RULE_LA_GEO_ABBREV
    class_id: LOCATION_ADDRESS
    match: token
    patterns: [geo pt, geo point, geo coord, geo coords, geo loc, gps coords]
  - id: RULE_LA_COORDS_PROVISIONAL
    class_id: LOCATION_ADDRESS
    match: token
    # "coordinates" may be geographic or just screen/chart positions.
    patterns: [coordinates, coordinate, coords, coord]
    exclude_patterns:
      - screen coordinates
      - screen coords
      - pixel coordinates
      - pixel coords
      - click coordinates
      - click coords
      - mouse coordinates
      - cursor coordinates
      - x coordinate
      - x coordinates
      - y coordinate
      - y coordinates
      - x coord
      - y coord
