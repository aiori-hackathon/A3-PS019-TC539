# EXPLORATORY HELD-OUT PROBE for FieldLedger detection rules. NOT an independently validated benchmark.
# Written by the same engineer who wrote the rules, AFTER the rules were frozen and AFTER that engineer
# had seen the benchmark. Names here are not in the synthetic benchmark and were not used to write rules;
# labels are the author's own judgement of the PS-019 taxonomy, assigned before the probe was run.
# (Seven names that also occur in the synthetic benchmark were removed to keep the probe disjoint.)
# Size is small (about 99 names): treat results as indicative only.
# kind: standard = plain full-word keyword; abbreviation = abbreviated or opaque;
#       variant = spelling/wording variant; lookalike/abbrev_lookalike/plain = not personal data.
