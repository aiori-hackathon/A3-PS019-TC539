[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldledger"
version = "0.0.1"
description = "FieldLedger: configurable personal-data discovery and privacy evidence inventory (AIORI-3 PS-019, Team Cipher)"
requires-python = ">=3.10"
dependencies = ["PyYAML"]

[project.optional-dependencies]
dev = ["pytest"]
# Optional web UI/API (docs/api-contract.md). The core CLI does not need these.
web = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "python-multipart>=0.0.32",
]
web-dev = [
    "fieldledger[web]",
    "httpx",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
